name: Release

# Push a tag that matches __version__ in backend/toolbox/__init__.py, e.g. v0.2.0 for 0.2.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches __version__
        id: version
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.Substring(1)
          $found = Select-String -Path backend/toolbox/__init__.py -Pattern '^__version__\s*=\s*["'']([^"'']+)["'']'
          if (-not $found) {
            Write-Output "::error::No __version__ found in backend/toolbox/__init__.py"
            exit 1
          }
          $appVersion = $found.Matches[0].Groups[1].Value
          if ($tagVersion -ne $appVersion) {
            Write-Output "::error::Tag $env:TAG doesn't match __version__ = '$appVersion' in backend/toolbox/__init__.py"
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$appVersion"
          Write-Output "Releasing Tessera $appVersion"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # WiX itself is restored by `dotnet tool restore` (dotnet-tools.json) inside scripts/build.py.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the app and the MSI
        run: python scripts/build.py --msi

      - name: Smoke test the packaged app
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Tessera.exe is a GUI program: Start-Process -Wait -PassThru is what gives us its exit code.
          $app = Start-Process -FilePath "dist\Tessera\Tessera.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($app.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "Tessera\toolbox.log"
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            Write-Output "::error::Tessera.exe --self-test failed with exit code $($app.ExitCode)"
            exit 1
          }
          Write-Output "Self-test passed"

      - name: Prepare the release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versioned = "Tessera-$env:VERSION-x64.msi"
          # The website links to releases/latest/download/Tessera-x64.msi: never rename this asset.
          $latest = "Tessera-x64.msi"
          Set-Location dist
          if (-not (Test-Path $versioned)) {
            Write-Output "::error::dist\$versioned wasn't built"
            exit 1
          }
          Copy-Item $versioned $latest
          $lines = foreach ($name in @($versioned, $latest)) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant(), $name
          }
          # LF line endings without a BOM, the format `sha256sum -c` reads.
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "SHA256SUMS.txt"), ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "Tessera $env:VERSION" `
            --generate-notes `
            "dist/Tessera-$env:VERSION-x64.msi" `
            "dist/Tessera-x64.msi" `
            "dist/SHA256SUMS.txt"
